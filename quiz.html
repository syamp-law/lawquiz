<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Quiz</title>
<link rel="stylesheet" href="style.css"/>
</head>
<body>

<div class="card" id="quizCard">
  <!-- PROGRESS BAR -->
  <div class="progress-container">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <div class="topbar">
    <span id="progressText">Q 1/1</span>
    <span class="timer" id="timer">55s</span>
  </div>
  
  <h2 id="questionText">Loading…</h2>
  <div id="options" class="options"></div>
  
  <!-- NEXT BUTTON (Hidden by default) -->
  <button id="nextBtn" class="btn-primary" style="display:none; width:100%; margin-top:20px; padding:14px;" onclick="nextQuestion()">Next Question →</button>
</div>

<div class="card hidden" id="resultCard">
  <h1>✅ Quiz Complete</h1>
  <p class="big" id="scoreLine"></p>
  <div id="review"></div>
  <p class="note">Thank you, <span id="who"></span>!</p>
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbw-MBciD5Q4O69dJ_Od21RfRP19FK9wRxrxfvzkBCLIOrPdxz7-ks56wdja8e0w-tc9/exec';
const TIME_PER_Q = 55;

let questions = [];
let current = 0;
let answers = [];
let timerId = null;
let timeLeft = TIME_PER_Q;
let answered = false;

const participant = JSON.parse(sessionStorage.getItem('participant') || '{}');
if (!participant.name) window.location.href = 'index.html';

async function loadQuestions() {
  try {
    const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'getQuestions' }) });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    if (!data.questions || data.questions.length === 0) {
      document.getElementById('questionText').textContent = 'No questions configured.';
      return;
    }
    questions = data.questions;
    answers = new Array(questions.length).fill(null);
    renderQuestion();
    startTimer();
  } catch (err) {
    document.getElementById('questionText').textContent = 'Failed to load: ' + err.message;
  }
}

function renderQuestion() {
  answered = false;
  const q = questions[current];
  
  document.getElementById('progressText').textContent = `Q ${current + 1}/${questions.length}`;
  document.getElementById('progressBar').style.width = `${((current + 1) / questions.length) * 100}%`;
  
  document.getElementById('questionText').textContent = q.question;
  document.getElementById('nextBtn').style.display = 'none';
  
  const box = document.getElementById('options');
  box.innerHTML = '';
  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.textContent = opt;
    btn.onclick = () => pickAnswer(i);
    box.appendChild(btn);
  });
}

function pickAnswer(i) {
  if (answered) return;
  answered = true;
  
  answers[current] = i;
  clearInterval(timerId);
  
  document.querySelectorAll('.option').forEach((b, idx) => {
    b.disabled = true;
    if (idx === i) b.classList.add('selected');
  });
  
  const nextBtn = document.getElementById('nextBtn');
  nextBtn.style.display = 'block';
  nextBtn.textContent = (current === questions.length - 1) ? 'Submit Quiz ✅' : 'Next Question →';
}

function startTimer() {
  timeLeft = TIME_PER_Q;
  document.getElementById('timer').textContent = timeLeft + 's';
  document.getElementById('timer').classList.remove('danger');
  
  timerId = setInterval(() => {
    timeLeft--;
    document.getElementById('timer').textContent = timeLeft + 's';
    if (timeLeft <= 10) document.getElementById('timer').classList.add('danger');
    
    if (timeLeft <= 0) {
      clearInterval(timerId);
      if (!answered) {
        answered = true;
        answers[current] = null; 
        const nextBtn = document.getElementById('nextBtn');
        nextBtn.style.display = 'block';
        nextBtn.textContent = (current === questions.length - 1) ? 'Submit Quiz ✅' : 'Time up! Next →';
        document.querySelectorAll('.option').forEach(b => b.disabled = true);
      }
    }
  }, 1000);
}

function nextQuestion() {
  current++;
  if (current < questions.length) {
    renderQuestion();
    startTimer();
  } else {
    submitQuiz();
  }
}

/* ============================================================
   UPDATED SUBMIT LOGIC WITH LOADING MESSAGE
   ============================================================ */
async function submitQuiz() {
  document.getElementById('quizCard').classList.add('hidden');
  document.getElementById('resultCard').classList.remove('hidden');
  
  // Show loading state
  document.getElementById('scoreLine').textContent = 'Submitting...';
  document.getElementById('who').textContent = participant.name;
  
  const review = document.getElementById('review');
  review.innerHTML = `
    <div style="text-align:center; padding: 40px 0;">
      <div class="spinner"></div>
      <p style="color:#666; margin-top:16px; font-weight:500;">Calculating your score and generating review...</p>
    </div>`;

  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({
        action: 'submit',
        name: participant.name,
        mobile: participant.mobile,
        place: participant.place,
        answers: answers
      })
    });
    const result = await res.json();
    if (result.error) throw new Error(result.error);
    
    // Now render the actual result
    showResult(result);
  } catch (err) {
    document.getElementById('scoreLine').textContent = 'Error';
    review.innerHTML = `<p style="color:#e53935; text-align:center;">Submission failed: ${err.message}</p>`;
  }
}

function showResult(result) {
  // Update the score and clear the loading spinner
  document.getElementById('scoreLine').textContent = `${result.score} / ${result.total}`;
  
  const review = document.getElementById('review');
  review.innerHTML = '<h3>Answer Review</h3>';

  questions.forEach((q, i) => {
    const correctIdx = result.correctAnswers[i];
    const selectedIdx = answers[i];
    const block = document.createElement('div');
    block.className = 'review-block';
    block.innerHTML = `<p class="rq">${i + 1}. ${q.question}</p>`;

    q.options.forEach((opt, j) => {
      const line = document.createElement('div');
      line.className = 'ropt';
      if (j === correctIdx) line.classList.add('correct');
      if (j === selectedIdx && selectedIdx !== correctIdx) line.classList.add('wrong');
      
      let suffix = '';
      if (j === correctIdx) suffix = '  ✔';
      else if (j === selectedIdx) suffix = '  ✘';
      
      line.textContent = opt + suffix;
      block.appendChild(line);
    });
    review.appendChild(block);
  });
  
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

loadQuestions();
</script>
</body>
</html>
